limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# Real client IP when we sit behind NPM/cloudflared: trust X-Forwarded-For only from private (docker/LAN) hops.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Scheme the visitor used: Cloudflare tells us in CF-Visitor (NPM rewrites X-Forwarded-Proto to http), else our own scheme
map $http_cf_visitor $fwd_proto {
    default          $scheme;
    '~"scheme":"https"' https;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    include /etc/nginx/security-headers.inc;

    # backend (gunicorn)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 60s;
    }
    location = /api/auth/login/ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
    location /django-admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # uploaded files and Django static (admin) come from shared volumes
    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/security-headers.inc;
    }
    location /static/ {
        alias /srv/static/;
        expires 7d;
    }

    # SPA
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.inc;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.inc;
    }
}
